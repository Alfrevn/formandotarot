:root{
  --display:"FT Titulos","Times New Roman",serif;
  --bg:#f6f1e7; --surface:#fffdf8; --ink:#2a2233; --muted:#6b6175; --line:#e4dccd;
  --accent:#5b3a8c; --accent-ink:#ffffff; --gold:#86651d; --chip:#efe7f7; --chip-ink:#4a2f73;
  --shadow:0 1px 2px rgba(42,34,51,.06),0 4px 14px rgba(42,34,51,.06);
  --pk-off:#f3d2ad; --pk-off-rib:#d9a46e; --pk-off-ink:#2a2233; --pk-stem:#556b2f; --err:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16111f; --surface:#211a2d; --ink:#f1ebf7; --muted:#b5abc2; --line:#352b45;
    --accent:#c4a2f5; --accent-ink:#1a1325; --gold:#e0bd6a; --chip:#2e2440; --chip-ink:#dccaf7;
    --shadow:none; color-scheme:dark;
    --pk-off:#3d2616; --pk-off-rib:#6b4223; --pk-off-ink:#f1ebf7; --pk-stem:#7c9450; --err:#ffb4ab;
  }
}
:root[data-theme="dark"]{
  --bg:#16111f; --surface:#211a2d; --ink:#f1ebf7; --muted:#b5abc2; --line:#352b45;
  --accent:#c4a2f5; --accent-ink:#1a1325; --gold:#e0bd6a; --chip:#2e2440; --chip-ink:#dccaf7;
  --shadow:none; color-scheme:dark;
  --pk-off:#3d2616; --pk-off-rib:#6b4223; --pk-off-ink:#f1ebf7; --pk-stem:#7c9450; --err:#ffb4ab;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.brand .star{color:var(--gold);font-size:18px}
.langs{display:flex;gap:4px}
.langs button{position:relative;display:grid;place-items:center;width:44px;height:40px;padding:0;border:0;background:none;color:var(--pk-off-ink);font:700 12.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.langs button .pk{position:absolute;inset:0;width:100%;height:100%}
.langs button span{position:relative;padding-top:7px}
.pk-body{fill:var(--pk-off)}.pk-rib{fill:none;stroke:var(--pk-off-rib);stroke-width:1.3}.pk-stem{fill:var(--pk-stem)}
.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:50%}
@media (max-width:374px){.brand{font-size:15px;letter-spacing:.02em}}
@media (max-width:340px){.brand{font-size:13px}.langs{gap:2px}.langs button{width:40px;height:37px}}
.langs button[aria-pressed="true"]{color:#2b1203}
.langs button[aria-pressed="true"] .pk-body{fill:#e8731c}
.langs button[aria-pressed="true"] .pk-rib{stroke:#b4500e}
main{padding-block:20px 8px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.015em;line-height:1.25;margin:0 0 10px}
h1,h2{text-transform:uppercase;letter-spacing:.02em}
h1{font-size:24px}
h2{font-size:22px}
h3{font-size:16px;font-family:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:22px}
p{margin:0 0 12px}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin:0 0 14px}
.event dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.event dt{color:var(--muted);font-size:14px}
.event dd{margin:0;font-weight:600}
.cta{display:grid;gap:10px;margin:16px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;border:0;font-size:16px;text-align:center}
.btn.alt{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:2px;min-height:84px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}
.tile .num{font-family:var(--display);color:var(--gold);font-weight:700;font-size:15px;letter-spacing:.02em}
.tile .name{font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.3;letter-spacing:.02em;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 10px;border-radius:12px;background:var(--chip);color:var(--gold);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{background:var(--chip);color:var(--chip-ink);padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600}
ol.q{margin:0;padding-left:22px}
ol.q li{margin:0 0 8px}
.pager{display:flex;justify-content:space-between;gap:10px;margin:18px 0 6px}
.pager a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:8px}
.back{display:inline-block;margin:0 0 14px;font-weight:600;text-decoration:none}
.elements{display:grid;gap:12px}
.el{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.el svg{flex:0 0 52px;width:52px;height:52px;color:var(--gold)}
.el .t{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.big-icon{width:84px;height:84px;color:var(--gold);display:block;margin:0 0 8px}
.msg{font-size:18px;line-height:1.55}
.arc-link{display:inline-block;margin:-4px 0 12px;font-weight:600;font-size:15px;text-decoration:none}
.more{margin:26px 0 8px}
.more h3{margin-top:0}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.about{text-align:center;margin-top:18px}
.about .logo{display:block;width:min(250px,72%);height:auto;margin:8px auto 16px;color:var(--ink)}
.about-p{max-width:32em;margin:0 auto}
.about-p2{margin-top:10px}
.about h3{margin-top:20px}
.contact{display:grid;gap:8px;text-align:left}
.c-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-decoration:none}
.c-l{color:var(--muted);font-size:14px;font-weight:600}
.c-v{color:var(--accent);font-weight:700;text-align:right;overflow-wrap:anywhere}
.links a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.note{font-size:14px;color:var(--muted)}
.fb{display:grid;gap:12px}
.fb .fb-l,.fb .fb-legend{font-weight:700;font-size:15px}
.fb textarea,.fb input[type=text]{display:block;width:100%;font:inherit;font-size:17px;line-height:1.5;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;resize:none}
.fb textarea{min-height:142px;overflow:hidden}
.fb textarea::placeholder,.fb input::placeholder{color:var(--muted);opacity:1}
.fb textarea:focus,.fb input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.fb-count{font-size:13px;color:var(--muted);text-align:right;margin-top:-6px}
.fb-count.near{color:var(--gold);font-weight:700}
.fb-opts{display:flex;flex-wrap:wrap;gap:0 18px}
.fb .opt{display:flex;align-items:center;gap:8px;min-height:44px;font-size:16px;cursor:pointer}
.fb .opt input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.fb .btn{width:100%;cursor:pointer;font-family:inherit}
.fb-status{font-size:14px;color:var(--muted);margin:0}
.fb-status.err{color:var(--err);font-weight:600}
.fb-done .msg{margin:0}
.fb [hidden]{display:none!important}
.ph{background:var(--chip);border-radius:6px;padding:0 4px}
footer{color:var(--muted);font-size:13px;text-align:center;padding-block:18px 28px}
footer .credit{font-size:11.5px;margin-top:6px}
.card-img{display:block;width:min(230px,64%);height:auto;aspect-ratio:3/5;margin:0 auto 16px;border-radius:10px;background:var(--chip);box-shadow:var(--shadow)}
</style>
</head>

 {id:"cadena",icon:"chain",arc:15,
  es:{name:"La cadena",kw:["Apegos","Sombra","Libertad"],msg:"Elegiste la cadena. En El Diablo, dos figuras aparecen encadenadas, pero las cadenas están flojas y podrían quitárselas. Habla de apegos, miedos o deseos que te atan, y de esa parte de ti que prefieres no mirar. Reconocerla es lo que afloja la cadena.",q:"¿Qué cadena sigues llevando aunque podrías quitártela?"},
  en:{name:"The chain",kw:["Attachments","Shadow","Freedom"],msg:"You chose the chain. In The Devil, two figures appear chained, but the chains are loose and they could take them off. It speaks of attachments, fears or desires that bind you, and of the part of yourself you would rather not look at. Recognising it is what loosens the chain.",q:"What chain are you still carrying even though you could take it off?"},
  pt:{name:"A corrente",kw:["Apegos","Sombra","Liberdade"],msg:"Escolheste a corrente. No Diabo, duas figuras aparecem acorrentadas, mas as correntes estão soltas e poderiam tirá-las. Fala de apegos, medos ou desejos que te prendem, e da parte de ti que preferes não olhar. Reconhecê-la é o que afrouxa a corrente.",q:"Que corrente continuas a carregar, mesmo podendo tirá-la?"}},
 {id:"flor",icon:"flower",arc:13,
  es:{name:"La flor",kw:["Transformación","Final","Renacer"],msg:"Elegiste la flor. En La Muerte, el estandarte lleva una rosa blanca: el final de un ciclo también es una semilla. Habla de algo que termina para que otra cosa pueda nacer. Dejar ir lo que ya cumplió su tiempo es lo que permite volver a florecer.",q:"¿Qué está terminando en tu vida para dar lugar a algo nuevo?"},
  en:{name:"The flower",kw:["Transformation","Ending","Rebirth"],msg:"You chose the flower. In Death, the banner bears a white rose: the end of a cycle is also a seed. It speaks of something that ends so that something else can be born. Letting go of what has run its course is what allows you to bloom again.",q:"What is ending in your life to make room for something new?"},
  pt:{name:"A flor",kw:["Transformação","Fim","Renascer"],msg:"Escolheste a flor. Na Morte, o estandarte leva uma rosa branca: o fim de um ciclo também é uma semente. Fala de algo que termina para que outra coisa possa nascer. Deixar ir o que já cumpriu o seu tempo é o que permite voltar a florescer.",q:"O que está a terminar na tua vida para dar lugar a algo novo?"}},
 {id:"corona",icon:"crown",arc:16,

  en:{name:"The fallen crown",kw:["Collapse","Truth","Liberation"],msg:"You chose the fallen crown. In The Tower, lightning knocks the crown from the top and what seemed solid collapses. It speaks of structures, ideas or certainties that no longer hold you up. What falls reveals what is true and makes room to build on more honest foundations.",q:"What certainty is falling in your life, and what truth does it reveal?"},
  pt:{name:"A coroa caída",kw:["Queda","Verdade","Libertação"],msg:"Escolheste a coroa caída. Na Torre, um raio arranca a coroa do topo e o que parecia firme desmorona-se. Fala de estruturas, ideias ou certezas que já não te sustentam. O que cai deixa ver o verdadeiro e abre espaço para construir sobre bases mais honestas.",q:"Que certeza está a cair na tua vida e que verdade deixa a descoberto?"}}

var ARCANA = [
 {r:"0",
  es:{n:"El Loco",kw:["Comienzo","Libertad","Confianza","Salto"],t:"El Loco abre el camino con curiosidad y sin equipaje. Invita a confiar en lo nuevo y a dar el primer paso, aunque no conozcas todo el recorrido.",q:["¿Qué empezarías hoy si no tuvieras miedo a equivocarte?","¿Qué peso podrías soltar para avanzar más liviano?","¿Dónde te está llamando la aventura?"]},
  en:{n:"The Fool",kw:["Beginnings","Freedom","Trust","Leap"],t:"The Fool sets off with curiosity and no baggage. It invites you to trust what is new and take the first step, even if you can’t see the whole path.",q:["What would you start today if you weren’t afraid of making mistakes?","What weight could you put down to move more lightly?","Where is adventure calling you?"]},
  pt:{n:"O Louco",kw:["Início","Liberdade","Confiança","Salto"],t:"O Louco abre o caminho com curiosidade e sem bagagem. Convida-te a confiar no que é novo e a dar o primeiro passo, mesmo sem conheceres todo o percurso.",q:["O que começarias hoje se não tivesses medo de errar?","Que peso poderias largar para avançar mais leve?","Onde é que a aventura te está a chamar?"]}},
 {r:"I",
  es:{n:"El Mago",kw:["Iniciativa","Talento","Voluntad","Recursos"],t:"El Mago tiene sobre la mesa todo lo que necesita. Te recuerda que ya cuentas con las herramientas para convertir una idea en realidad, si unes intención y acción.",q:["¿Qué talento tuyo estás subestimando?","¿Qué idea está lista para pasar a la acción?","¿Qué recursos tienes hoy al alcance de la mano?"]},
  en:{n:"The Magician",kw:["Initiative","Talent","Willpower","Resources"],t:"The Magician has everything needed on the table. It reminds you that you already have the tools to turn an idea into reality when intention meets action.",q:["Which of your talents are you underestimating?","Which idea is ready to be put into action?","What resources are within your reach today?"]},
  pt:{n:"O Mago",kw:["Iniciativa","Talento","Vontade","Recursos"],t:"O Mago tem sobre a mesa tudo o que precisa. Lembra-te de que já tens as ferramentas para transformar uma ideia em realidade, se unires intenção e ação.",q:["Que talento teu estás a subestimar?","Que ideia está pronta para passar à ação?","Que recursos tens hoje ao teu alcance?"]}},
 {r:"II",
  es:{n:"La Sacerdotisa",kw:["Intuición","Silencio","Sabiduría interior","Misterio"],t:"La Sacerdotisa guarda el conocimiento que no se dice en voz alta. Te invita a escuchar tu intuición y a darte tiempo antes de decidir.",q:["¿Qué sabes en el fondo, aunque todavía no lo digas?","¿Qué te diría tu intuición si la escucharas en silencio?","¿Qué necesitas observar antes de actuar?"]},
  en:{n:"The High Priestess",kw:["Intuition","Silence","Inner wisdom","Mystery"],t:"The High Priestess keeps the knowledge that is not spoken aloud. She invites you to listen to your intuition and take your time before deciding.",q:["What do you know deep down, even if you haven’t said it yet?","What would your intuition tell you if you listened in silence?","What do you need to observe before acting?"]},
  pt:{n:"A Sacerdotisa",kw:["Intuição","Silêncio","Sabedoria interior","Mistério"],t:"A Sacerdotisa guarda o conhecimento que não se diz em voz alta. Convida-te a escutar a tua intuição e a dar-te tempo antes de decidir.",q:["O que sabes no fundo, mesmo que ainda não o digas?","O que te diria a tua intuição se a escutasses em silêncio?","O que precisas de observar antes de agir?"]}},
 {r:"III",
  es:{n:"La Emperatriz",kw:["Creatividad","Abundancia","Cuidado","Fertilidad"],t:"La Emperatriz representa la vida que crece cuando se la nutre. Habla de crear, de disfrutar y de cuidar lo que amas, empezando por ti.",q:["¿Qué estás gestando que merece más cuidado?","¿Cómo puedes nutrirte mejor esta semana?","¿Dónde hay abundancia en tu vida que no estás viendo?"]},
  en:{n:"The Empress",kw:["Creativity","Abundance","Care","Fertility"],t:"The Empress represents life that grows when it is nurtured. She speaks of creating, enjoying and caring for what you love, starting with yourself.",q:["What are you growing that deserves more care?","How can you nourish yourself better this week?","Where is there abundance in your life that you’re not seeing?"]},
  pt:{n:"A Imperatriz",kw:["Criatividade","Abundância","Cuidado","Fertilidade"],t:"A Imperatriz representa a vida que cresce quando é nutrida. Fala de criar, de desfrutar e de cuidar do que amas, a começar por ti.",q:["O que estás a gerar que merece mais cuidado?","Como podes nutrir-te melhor esta semana?","Onde há abundância na tua vida que não estás a ver?"]}},
 {r:"IV",
  es:{n:"El Emperador",kw:["Estructura","Orden","Liderazgo","Límites"],t:"El Emperador construye bases firmes. Te invita a ordenar, a poner límites claros y a asumir la responsabilidad de tus decisiones.",q:["¿Qué área de tu vida pide más orden?","¿Qué límite necesitas poner con claridad?","¿Dónde puedes ejercer tu autoridad con serenidad?"]},
  en:{n:"The Emperor",kw:["Structure","Order","Leadership","Boundaries"],t:"The Emperor builds solid foundations. He invites you to bring order, set clear boundaries and take responsibility for your decisions.",q:["Which area of your life needs more order?","What boundary do you need to set clearly?","Where can you exercise your authority calmly?"]},
  pt:{n:"O Imperador",kw:["Estrutura","Ordem","Liderança","Limites"],t:"O Imperador constrói bases firmes. Convida-te a organizar, a estabelecer limites claros e a assumir a responsabilidade pelas tuas decisões.",q:["Que área da tua vida pede mais ordem?","Que limite precisas de estabelecer com clareza?","Onde podes exercer a tua autoridade com serenidade?"]}},
 {r:"V",
  es:{n:"El Sumo Sacerdote",kw:["Tradición","Enseñanza","Valores","Guía"],t:"El Sumo Sacerdote es el maestro que transmite un saber. Habla de aprender, de compartir lo que sabes y de los valores que guían tu camino.",q:["¿Qué creencias te sostienen y cuáles ya no te sirven?","¿De quién podrías aprender ahora?","¿Qué sabiduría tuya podrías compartir?"]},
  en:{n:"The Hierophant",kw:["Tradition","Teaching","Values","Guidance"],t:"The Hierophant is the teacher who passes on knowledge. He speaks of learning, sharing what you know and the values that guide your path.",q:["Which beliefs support you, and which no longer serve you?","Who could you learn from right now?","What wisdom of yours could you share?"]},
  pt:{n:"O Hierofante",kw:["Tradição","Ensino","Valores","Orientação"],t:"O Hierofante é o mestre que transmite um saber. Fala de aprender, de partilhar o que sabes e dos valores que guiam o teu caminho.",q:["Que crenças te sustentam e quais já não te servem?","Com quem poderias aprender agora?","Que sabedoria tua poderias partilhar?"]}},
 {r:"VI",
  es:{n:"Los Enamorados",kw:["Elección","Vínculo","Valores","Unión"],t:"Los Enamorados hablan de elegir con el corazón y con coherencia. Una decisión importante pide estar alineada con lo que de verdad valoras.",q:["¿Qué elección estás postergando?","¿Tu decisión refleja lo que de verdad valoras?","¿Qué vínculo te hace crecer?"]},
  en:{n:"The Lovers",kw:["Choice","Connection","Values","Union"],t:"The Lovers speak of choosing with your heart and with integrity. An important decision asks to be aligned with what you truly value.",q:["What choice are you putting off?","Does your decision reflect what you truly value?","Which relationship helps you grow?"]},
  pt:{n:"Os Enamorados",kw:["Escolha","Vínculo","Valores","União"],t:"Os Enamorados falam de escolher com o coração e com coerência. Uma decisão importante pede para estar alinhada com o que realmente valorizas.",q:["Que escolha estás a adiar?","A tua decisão reflete o que realmente valorizas?","Que vínculo te faz crescer?"]}},
 {r:"VII",
  es:{n:"El Carro",kw:["Avance","Determinación","Dirección","Logro"],t:"El Carro avanza cuando las fuerzas internas tiran hacia el mismo lado. Te invita a definir un rumbo y a sostenerlo con decisión.",q:["¿Hacia dónde quieres ir realmente?","¿Qué fuerzas internas tiran en direcciones opuestas?","¿Qué paso concreto te acerca a tu meta?"]},
  en:{n:"The Chariot",kw:["Progress","Determination","Direction","Achievement"],t:"The Chariot moves forward when inner forces pull in the same direction. It invites you to set a course and hold it with determination.",q:["Where do you really want to go?","Which inner forces are pulling in opposite directions?","What concrete step brings you closer to your goal?"]},
  pt:{n:"O Carro",kw:["Avanço","Determinação","Direção","Conquista"],t:"O Carro avança quando as forças interiores puxam para o mesmo lado. Convida-te a definir um rumo e a mantê-lo com determinação.",q:["Para onde queres realmente ir?","Que forças interiores puxam em direções opostas?","Que passo concreto te aproxima da tua meta?"]}},
 {r:"VIII",
  es:{n:"La Fuerza",kw:["Coraje","Paciencia","Compasión","Dominio de sí"],t:"La Fuerza no es dureza: es la calma que domina el impulso. Habla de un coraje amable y de confiar en tu fortaleza interior.",q:["¿Qué emoción necesitas acompañar en lugar de reprimir?","¿Dónde puedes ser firme y amable a la vez?","¿Qué te recuerda tu propia fortaleza?"]},
  en:{n:"Strength",kw:["Courage","Patience","Compassion","Self-mastery"],t:"Strength is not hardness: it is the calm that masters impulse. It speaks of gentle courage and trusting your inner strength.",q:["Which emotion do you need to accompany rather than suppress?","Where can you be firm and kind at the same time?","What reminds you of your own strength?"]},
  pt:{n:"A Força",kw:["Coragem","Paciência","Compaixão","Domínio de si"],t:"A Força não é dureza: é a calma que domina o impulso. Fala de uma coragem gentil e de confiar na tua força interior.",q:["Que emoção precisas de acompanhar em vez de reprimir?","Onde podes ser firme e gentil ao mesmo tempo?","O que te lembra a tua própria força?"]}},
 {r:"IX",
  es:{n:"El Ermitaño",kw:["Introspección","Búsqueda","Prudencia","Luz interior"],t:"El Ermitaño se aparta para encontrar respuestas con su propia luz. Te invita a hacer una pausa y a escucharte.",q:["¿Qué respuesta solo puedes encontrar en soledad?","¿Qué te estás perdiendo por ir tan rápido?","¿Qué luz interior te guía hoy?"]},
  en:{n:"The Hermit",kw:["Introspection","Search","Prudence","Inner light"],t:"The Hermit withdraws to find answers by his own light. He invites you to pause and listen to yourself.",q:["What answer can you only find in solitude?","What are you missing by going so fast?","What inner light is guiding you today?"]},
  pt:{n:"O Eremita",kw:["Introspeção","Busca","Prudência","Luz interior"],t:"O Eremita afasta-se para encontrar respostas com a sua própria luz. Convida-te a fazer uma pausa e a escutar-te.",q:["Que resposta só podes encontrar em solidão?","O que estás a perder por ir tão depressa?","Que luz interior te guia hoje?"]}},
 {r:"X",

  en:{n:"Wheel of Fortune",kw:["Cycles","Change","Opportunity","Destiny"],t:"The Wheel turns: what rises falls, and what falls rises again. It speaks of accepting cycles and seizing the right moment.",q:["Which cycle is closing in your life?","What opportunity is passing in front of you?","How can you flow with change instead of resisting it?"]},
  pt:{n:"A Roda da Fortuna",kw:["Ciclos","Mudança","Oportunidade","Destino"],t:"A Roda gira: o que sobe desce e o que desce volta a subir. Fala de aceitar os ciclos e de aproveitar o momento certo.",q:["Que ciclo está a fechar-se na tua vida?","Que oportunidade está a passar à tua frente?","Como podes fluir com a mudança em vez de lhe resistir?"]}},

  en:{n:"Death",kw:["Transformation","Ending","Renewal","Letting go"],t:"Death announces the end of one stage so that another can begin. It is not about physical loss: it is about transformation and letting go of what has completed its cycle.",q:["What needs to end so that something new can begin?","What are you holding on to out of habit?","Which version of you is being born?"]},

 {r:"XIV",
  es:{n:"La Templanza",kw:["Equilibrio","Moderación","Paciencia","Integración"],t:"La Templanza mezcla con calma lo que parece opuesto. Te invita a buscar el punto medio y a darles tiempo a los procesos.",q:["¿Qué extremos puedes equilibrar?","¿Dónde necesitas más paciencia?","¿Qué partes de ti buscan integrarse?"]},
  en:{n:"Temperance",kw:["Balance","Moderation","Patience","Integration"],t:"Temperance calmly blends what seems opposite. It invites you to seek the middle ground and give processes time.",q:["Which extremes can you balance?","Where do you need more patience?","Which parts of you are seeking to come together?"]},

  en:{n:"The Tower",kw:["Upheaval","Revelation","Liberation","Sudden change"],t:"The Tower brings down what was built on false foundations. Although it shakes things up, it clears the ground to build something more authentic.",q:["Which structure in your life no longer holds?","What truth is being revealed?","What would you build if you started again?"]},

  en:{n:"The Star",kw:["Hope","Inspiration","Healing","Faith"],t:"The Star appears after the storm. It brings calm, hope and the trust that the path has meaning.",q:["What gives you hope again?","Which dream deserves your trust?","How can you share your light with others?"]},

  en:{n:"The Moon",kw:["Intuition","Dreams","Uncertainty","Deep emotions"],t:"The Moon only half lights the way: it shows the world of dreams, fears and imagination. It invites you to cross uncertainty guided by your intuition.",q:["Which fear is distorting what you see?","What have your dreams been telling you lately?","What can you accept even if you don’t fully understand it?"]},
  pt:{n:"A Lua",kw:["Intuição","Sonhos","Incerteza","Emoções profundas"],t:"A Lua ilumina pela metade: mostra o mundo dos sonhos, dos medos e da imaginação. Convida-te a atravessar a incerteza guiando-te pela tua intuição.",q:["Que medo está a distorcer o que vês?","O que te dizem os teus sonhos ultimamente?","O que podes aceitar mesmo sem o compreender totalmente?"]}},

  en:{n:"The Sun",kw:["Joy","Clarity","Vitality","Success"],t:"The Sun lights everything with clarity and warmth. It speaks of simple joy, confidence and showing yourself as you are.",q:["What makes you feel alive?","Where can you show yourself more authentically?","Which achievement deserves to be celebrated?"]},
  pt:{n:"O Sol",kw:["Alegria","Clareza","Vitalidade","Sucesso"],t:"O Sol ilumina tudo com clareza e calor. Fala de alegria simples, de confiança e de te mostrares tal como és.",q:["O que te enche de vida?","Onde podes mostrar-te com mais autenticidade?","Que conquista merece ser celebrada?"]}},

  pt:{n:"O Julgamento",kw:["Despertar","Chamamento","Renascimento","Balanço"],t:"O Julgamento é um chamamento para despertar. Convida-te a rever o caminho percorrido, a perdoar e a responder à tua verdadeira vocação.",q:["Que chamamento interior estás a ouvir?","O que precisas de perdoar, aos outros ou a ti?","Que parte de ti está pronta para renascer?"]}},

/* ===== Utilidades ===== */
var LANGS = ["es","en","pt"];
function storeGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function storeSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function initialLang(){
  var m = /[?&]lang=(es|en|pt)/.exec(location.search); if(m) return m[1];
  var s = storeGet("ft-lang"); if(s && LANGS.indexOf(s) > -1) return s;
  var n = (navigator.language || "es").toLowerCase();
  if(n.indexOf("pt") === 0) return "pt";
  if(n.indexOf("es") === 0) return "es";
  return "en";
}
var lang = initialLang();
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k === "text") e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c == null) return; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function route(){
  var p = (location.hash || "#arcanos").replace(/^#\/?/, "").split(/[\/-]/);
  return {page: p[0] || "arcanos", id: p[1]};
}

function viewArcana(t){

  }));
  return [h("h1",{text:t.arcTitle}), h("p",{class:"lead",text:t.arcLead}), grid, more(t,"arcanos")];
}
function viewArcanum(t,i){

  return [h("a",{class:"back",href:"#arcanos",text:t.backArc}),
    h("div",{class:"card"},[
      h("img",{class:"card-img",src:"carta-"+(i<10?"0":"")+i+".jpg",alt:t.cardAlt+": "+d.n,width:"300",height:"500",decoding:"async"}),
      h("span",{class:"badge",text:a.r}), h("h1",{text:d.n}),
      h("h3",{text:t.kw}), h("div",{class:"chips"}, d.kw.map(function(k){return h("span",{class:"chip",text:k})})),
      h("h3",{text:t.meaning}), h("p",{text:d.t}),
      h("h3",{text:t.questions}), h("ol",{class:"q"}, d.q.map(function(q){return h("li",{text:q})}))
    ]),
    h("p",{class:"note",text:t.readingCta}),
    h("div",{class:"pager"},[h("a",{href:"#arcanos-"+prev,text:"← "+t.prev}), h("a",{href:"#arcanos-"+next,text:t.next+" →"})]),

var fbDraft = {msg:"", name:"", named:false};
function viewInfo(t){
  var msg = h("textarea",{id:"fb-msg",name:"msg",rows:"5",maxlength:String(MSG_MAX),placeholder:t.fbPh,"aria-describedby":"fb-count"});
  msg.value = fbDraft.msg;
  var count = h("div",{id:"fb-count",class:"fb-count"});
  function upd(){ var n = msg.value.length; count.textContent = n + "/" + MSG_MAX; count.className = "fb-count" + (n >= MSG_MAX - 20 ? " near" : ""); }
  function grow(){ msg.style.height = "auto"; msg.style.height = (msg.scrollHeight + 3) + "px"; }
  upd();
  var rAnon = h("input",{type:"radio",name:"sign",value:"anon"}), rName = h("input",{type:"radio",name:"sign",value:"name"});
  rAnon.checked = !fbDraft.named; rName.checked = fbDraft.named;
  var name = h("input",{id:"fb-name",type:"text",name:"name",maxlength:String(NAME_MAX),autocomplete:"given-name",placeholder:t.fbNamePh,"aria-label":t.fbNamePh});
  name.value = fbDraft.name; name.hidden = !fbDraft.named;
  var status = h("p",{class:"fb-status",role:"status","aria-live":"polite"});
  var send = h("button",{type:"submit",class:"btn",text:t.fbSend});
  var hp = h("input",{type:"checkbox",name:"botcheck",tabindex:"-1","aria-hidden":"true",style:"display:none"});
  var form = h("form",{class:"card fb",novalidate:""},[
    h("label",{class:"fb-l",for:"fb-msg",text:t.fbLabel}), msg, count,
    h("div",{role:"radiogroup","aria-labelledby":"fb-sign"},[
      h("div",{class:"fb-legend",id:"fb-sign",text:t.fbSign}),
      h("div",{class:"fb-opts"},[h("label",{class:"opt"},[rAnon, h("span",{text:t.fbAnon})]), h("label",{class:"opt"},[rName, h("span",{text:t.fbNamed})])])
    ]),
    name, hp, send, status
  ]);
  msg.addEventListener("input", function(){ fbDraft.msg = msg.value; upd(); grow(); clear(); });
  name.addEventListener("input", function(){ fbDraft.name = name.value; clear(); });
  function clear(){ if(status.className.indexOf("err") > -1) say(""); }
  requestAnimationFrame(grow);
  function sign(){ fbDraft.named = rName.checked; name.hidden = !rName.checked; clear(); if(rName.checked) name.focus(); }
  rAnon.addEventListener("change", sign); rName.addEventListener("change", sign);
  function say(text, err){ status.textContent = text; status.className = "fb-status" + (err ? " err" : ""); }
  function done(note){
    fbDraft = {msg:"", name:"", named:false};
    var card = h("div",{class:"card fb-done"},[h("p",{class:"msg",text:t.fbThanks})].concat(note ? [h("p",{class:"note",text:note})] : []));
    form.replaceWith(card);
  }
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var text = msg.value.trim(), who = rName.checked ? name.value.trim() : t.fbAnonVal;
    if(!text){ say(t.fbNeedMsg, true); msg.focus(); return; }
    if(rName.checked && !who){ say(t.fbNeedName, true); name.focus(); return; }
    if(!WEB3FORMS_KEY){ done(t.fbPreview); return; }
    send.disabled = true; say("");
    fetch("https://api.web3forms.com/submit", {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({access_key:WEB3FORMS_KEY, subject:"Nueva opinión · Formando Tarot", from_name:"Formando Tarot", Mensaje:text, Nombre:who, botcheck:hp.checked})})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!j || !j.success) throw new Error("envío"); done(); })
      .catch(function(){ send.disabled = false; say(t.fbErr, true); });
  });
  return [h("h1",{text:t.infoTitle}), h("p",{class:"lead",text:t.fbLead}), form, aboutCard(), more(t,"info")];
}
function aboutCard(){
  var a = ABOUT[lang];
  var rows = [["Instagram", "@" + CONTACT.instagram, "https://www.instagram.com/" + CONTACT.instagram + "/", true],
              ["WhatsApp", CONTACT.whatsappShow, "https://wa.me/" + CONTACT.whatsapp, true],
              [a.mail, CONTACT.mail, "mailto:" + CONTACT.mail, false]];
  return h("section",{class:"card about"},[
    h("div",{class:"logo-wrap",html:LOGO_SVG}),
    h("p",{class:"about-p",text:a.p}),
    a.p2 ? h("p",{class:"about-p about-p2",text:a.p2}) : null,
    h("h3",{text:a.contact}),
    h("div",{class:"contact"}, rows.map(function(r){
      var at = {class:"c-row",href:r[2]}; if(r[3]){ at.target = "_blank"; at.rel = "noopener"; }
      return h("a",at,[h("span",{class:"c-l",text:r[0]}), h("span",{class:"c-v",text:r[1]})]);
    }))
  ]);
}
function more(t,current){
  var all = [["arcanos",t.goArc],["juego",t.goGame],["info",t.goInfo]];
  return h("section",{class:"more"},[h("h3",{text:t.moreTitle}),
    h("div",{class:"links"}, all.filter(function(x){return x[0] !== current}).map(function(x){return h("a",{href:"#"+x[0],text:x[1]})}))]);
}

function render(){
  var t = UI[lang], r = route(), app = document.getElementById("app"), nodes, title = "Formando Tarot";
  document.documentElement.lang = lang === "pt" ? "pt-PT" : lang;
  document.querySelectorAll(".langs button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
  if(r.page === "arcanos" && r.id !== undefined && /^\d+$/.test(r.id) && +r.id < 22){ nodes = viewArcanum(t,+r.id); title = ARCANA[+r.id][lang].n + " · Formando Tarot"; }
  else if(r.page === "arcanos"){ nodes = viewArcana(t); title = t.arcTitle + " · Formando Tarot"; }
  else if(r.page === "juego" && r.id){ var e = ELEMENTS.filter(function(x){return x.id === r.id})[0]; if(e){ nodes = viewElement(t,e); title = e[lang].name + " · Formando Tarot"; } else { nodes = viewGame(t); } }
  else if(r.page === "juego"){ nodes = viewGame(t); title = t.gameTitle + " · Formando Tarot"; }
  else if(r.page === "info" || r.page === "opiniones" || r.page === "nosotros"){ nodes = viewInfo(t); title = t.infoTitle + " · Formando Tarot"; }
  else { nodes = viewArcana(t); title = t.arcTitle + " · Formando Tarot"; }
  app.innerHTML = ""; nodes.forEach(function(n){ app.appendChild(n); });
  document.title = title;
  var foot = document.getElementById("foot"); foot.innerHTML = "";
  foot.appendChild(h("div",{text:t.foot})); foot.appendChild(h("div",{class:"credit",text:t.credit}));
}
document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click", function(){ lang = b.getAttribute("data-lang"); storeSet("ft-lang", lang); render(); });
});
window.addEventListener("hashchange", function(){ render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
