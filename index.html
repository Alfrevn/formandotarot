<style>
:root{
  --bg:#f6f1e7; --surface:#fffdf8; --ink:#2a2233; --muted:#6b6175; --line:#e4dccd;
  --accent:#5b3a8c; --accent-ink:#ffffff; --gold:#9a7424; --chip:#efe7f7; --chip-ink:#4a2f73;
  --shadow:0 1px 2px rgba(42,34,51,.06),0 4px 14px rgba(42,34,51,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16111f; --surface:#211a2d; --ink:#f1ebf7; --muted:#b5abc2; --line:#352b45;
    --accent:#c4a2f5; --accent-ink:#1a1325; --gold:#e0bd6a; --chip:#2e2440; --chip-ink:#dccaf7;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:700;letter-spacing:.2px}
.brand .star{color:var(--gold);font-size:18px}
.langs{display:flex;gap:4px}
.langs button{min-width:40px;min-height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:600 13px/1 inherit;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600}
nav.tabs a[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
main{padding:20px 0 8px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:0 0 10px}
h1{font-size:28px}
h2{font-size:22px}
h3{font-size:16px;font-family:inherit;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:22px}
p{margin:0 0 12px}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin:0 0 14px}
.event dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.event dt{color:var(--muted);font-size:14px}
.event dd{margin:0;font-weight:600}
.cta{display:grid;gap:10px;margin:16px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;border:0;font-size:16px;text-align:center}
.btn.alt{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:2px;min-height:84px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}
.tile .num{font-family:Georgia,serif;color:var(--gold);font-weight:700;font-size:15px}
.tile .name{font-weight:700;font-size:15px;line-height:1.3}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 10px;border-radius:12px;background:var(--chip);color:var(--gold);font-family:Georgia,serif;font-weight:700;font-size:18px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{background:var(--chip);color:var(--chip-ink);padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600}
ol.q{margin:0;padding-left:22px}
ol.q li{margin:0 0 8px}
.pager{display:flex;justify-content:space-between;gap:10px;margin:18px 0 6px}
.pager a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:8px}
.back{display:inline-block;margin:0 0 14px;font-weight:600;text-decoration:none}
.elements{display:grid;gap:12px}
.el{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.el svg{flex:0 0 52px;width:52px;height:52px;color:var(--gold)}
.el .t{font-weight:700;font-size:18px}
.big-icon{width:84px;height:84px;color:var(--gold);display:block;margin:0 0 8px}
.msg{font-family:Georgia,serif;font-size:19px;line-height:1.55}
.more{margin:26px 0 8px}
.more h3{margin-top:0}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.note{font-size:14px;color:var(--muted)}
.ph{background:var(--chip);border-radius:6px;padding:0 4px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:18px 0 28px}
</style>
</head>

  en:{n:"The Lovers",kw:["Choice","Connection","Values","Union"],t:"The Lovers speak of choosing with your heart and with integrity. An important decision asks to be aligned with what you truly value.",q:["What choice are you putting off?","Does your decision reflect what you truly value?","Which relationship helps you grow?"]},
  pt:{n:"Os Enamorados",kw:["Escolha","Vínculo","Valores","União"],t:"Os Enamorados falam de escolher com o coração e com coerência. Uma decisão importante pede para estar alinhada com o que realmente valorizas.",q:["Que escolha estás a adiar?","A tua decisão reflete o que realmente valorizas?","Que vínculo te faz crescer?"]}},
 {r:"VII",
  es:{n:"El Carro",kw:["Avance","Determinación","Dirección","Logro"],t:"El Carro avanza cuando las fuerzas internas tiran hacia el mismo lado. Te invita a definir un rumbo y a sostenerlo con decisión.",q:["¿Hacia dónde quieres ir realmente?","¿Qué fuerzas internas tiran en direcciones opuestas?","¿Qué paso concreto te acerca a tu meta?"]},
  en:{n:"The Chariot",kw:["Progress","Determination","Direction","Achievement"],t:"The Chariot moves forward when inner forces pull in the same direction. It invites you to set a course and hold it with determination.",q:["Where do you really want to go?","Which inner forces are pulling in opposite directions?","What concrete step brings you closer to your goal?"]},
  pt:{n:"O Carro",kw:["Avanço","Determinação","Direção","Conquista"],t:"O Carro avança quando as forças interiores puxam para o mesmo lado. Convida-te a definir um rumo e a mantê-lo com determinação.",q:["Para onde queres realmente ir?","Que forças interiores puxam em direções opostas?","Que passo concreto te aproxima da tua meta?"]}},
 {r:"VIII",
  es:{n:"La Fuerza",kw:["Coraje","Paciencia","Compasión","Dominio de sí"],t:"La Fuerza no es dureza: es la calma que domina el impulso. Habla de un coraje amable y de confiar en tu fortaleza interior.",q:["¿Qué emoción necesitas acompañar en lugar de reprimir?","¿Dónde puedes ser firme y amable a la vez?","¿Qué te recuerda tu propia fortaleza?"]},
  en:{n:"Strength",kw:["Courage","Patience","Compassion","Self-mastery"],t:"Strength is not hardness: it is the calm that masters impulse. It speaks of gentle courage and trusting your inner strength.",q:["Which emotion do you need to accompany rather than suppress?","Where can you be firm and kind at the same time?","What reminds you of your own strength?"]},
  pt:{n:"A Força",kw:["Coragem","Paciência","Compaixão","Domínio de si"],t:"A Força não é dureza: é a calma que domina o impulso. Fala de uma coragem gentil e de confiar na tua força interior.",q:["Que emoção precisas de acompanhar em vez de reprimir?","Onde podes ser firme e gentil ao mesmo tempo?","O que te lembra a tua própria força?"]}},
 {r:"IX",
  es:{n:"El Ermitaño",kw:["Introspección","Búsqueda","Prudencia","Luz interior"],t:"El Ermitaño se aparta para encontrar respuestas con su propia luz. Te invita a hacer una pausa y a escucharte.",q:["¿Qué respuesta solo puedes encontrar en soledad?","¿Qué te estás perdiendo por ir tan rápido?","¿Qué luz interior te guía hoy?"]},
  en:{n:"The Hermit",kw:["Introspection","Search","Prudence","Inner light"],t:"The Hermit withdraws to find answers by his own light. He invites you to pause and listen to yourself.",q:["What answer can you only find in solitude?","What are you missing by going so fast?","What inner light is guiding you today?"]},
  pt:{n:"O Eremita",kw:["Introspeção","Busca","Prudência","Luz interior"],t:"O Eremita afasta-se para encontrar respostas com a sua própria luz. Convida-te a fazer uma pausa e a escutar-te.",q:["Que resposta só podes encontrar em solidão?","O que estás a perder por ir tão depressa?","Que luz interior te guia hoje?"]}},
 {r:"X",
  es:{n:"La Rueda de la Fortuna",kw:["Ciclos","Cambio","Oportunidad","Destino"],t:"La Rueda gira: lo que sube baja y lo que baja vuelve a subir. Habla de aceptar los ciclos y de aprovechar el momento oportuno.",q:["¿Qué ciclo se está cerrando en tu vida?","¿Qué oportunidad está pasando frente a ti?","¿Cómo puedes fluir con el cambio en lugar de resistirlo?"]},
  en:{n:"Wheel of Fortune",kw:["Cycles","Change","Opportunity","Destiny"],t:"The Wheel turns: what rises falls, and what falls rises again. It speaks of accepting cycles and seizing the right moment.",q:["Which cycle is closing in your life?","What opportunity is passing in front of you?","How can you flow with change instead of resisting it?"]},
  pt:{n:"A Roda da Fortuna",kw:["Ciclos","Mudança","Oportunidade","Destino"],t:"A Roda gira: o que sobe desce e o que desce volta a subir. Fala de aceitar os ciclos e de aproveitar o momento certo.",q:["Que ciclo está a fechar-se na tua vida?","Que oportunidade está a passar à tua frente?","Como podes fluir com a mudança em vez de lhe resistir?"]}},
 {r:"XI",
  es:{n:"La Justicia",kw:["Equilibrio","Verdad","Responsabilidad","Causa y efecto"],t:"La Justicia pone en la balanza lo que das y lo que recibes. Te invita a ver con claridad, decidir con honestidad y asumir las consecuencias.",q:["¿Qué situación pide una mirada honesta?","¿Dónde hay desequilibrio entre lo que das y lo que recibes?","¿Qué decisión justa estás evitando?"]},
  en:{n:"Justice",kw:["Balance","Truth","Responsibility","Cause and effect"],t:"Justice weighs what you give and what you receive. She invites you to see clearly, decide honestly and accept the consequences.",q:["Which situation calls for an honest look?","Where is there an imbalance between what you give and what you receive?","What fair decision are you avoiding?"]},
  pt:{n:"A Justiça",kw:["Equilíbrio","Verdade","Responsabilidade","Causa e efeito"],t:"A Justiça põe na balança o que dás e o que recebes. Convida-te a ver com clareza, a decidir com honestidade e a assumir as consequências.",q:["Que situação pede um olhar honesto?","Onde há desequilíbrio entre o que dás e o que recebes?","Que decisão justa estás a evitar?"]}},
 {r:"XII",
  es:{n:"El Colgado",kw:["Pausa","Entrega","Otra perspectiva","Sacrificio"],t:"El Colgado mira el mundo al revés y descubre lo que antes no veía. Habla de soltar el control y de cambiar de punto de vista.",q:["¿Qué verías si miraras esta situación desde otro ángulo?","¿Qué necesitas soltar?","¿Qué aprendizaje trae esta espera?"]},
  en:{n:"The Hanged Man",kw:["Pause","Surrender","New perspective","Sacrifice"],t:"The Hanged Man sees the world upside down and discovers what he couldn’t see before. He speaks of letting go of control and changing your point of view.",q:["What would you see if you looked at this situation from another angle?","What do you need to let go of?","What lesson does this waiting bring?"]},
  pt:{n:"O Enforcado",kw:["Pausa","Entrega","Nova perspetiva","Sacrifício"],t:"O Enforcado vê o mundo de pernas para o ar e descobre o que antes não via. Fala de largar o controlo e de mudar de ponto de vista.",q:["O que verias se olhasses para esta situação de outro ângulo?","O que precisas de largar?","Que aprendizagem traz esta espera?"]}},
 {r:"XIII",
  es:{n:"La Muerte",kw:["Transformación","Final","Renovación","Desapego"],t:"La Muerte anuncia el fin de una etapa para que nazca otra. No habla de pérdida física: habla de transformación y de dejar ir lo que ya cumplió su ciclo.",q:["¿Qué necesita terminar para que algo nuevo empiece?","¿A qué te aferras por costumbre?","¿Qué versión de ti está naciendo?"]},
  en:{n:"Death",kw:["Transformation","Ending","Renewal","Letting go"],t:"Death announces the end of one stage so that another can begin. It is not about physical loss: it is about transformation and letting go of what has completed its cycle.",q:["What needs to end so that something new can begin?","What are you holding on to out of habit?","Which version of you is being born?"]},
  pt:{n:"A Morte",kw:["Transformação","Fim","Renovação","Desapego"],t:"A Morte anuncia o fim de uma etapa para que outra possa nascer. Não fala de perda física: fala de transformação e de deixar ir o que já cumpriu o seu ciclo.",q:["O que precisa de terminar para que algo novo comece?","A que te agarras por hábito?","Que versão de ti está a nascer?"]}},
 {r:"XIV",
  es:{n:"La Templanza",kw:["Equilibrio","Moderación","Paciencia","Integración"],t:"La Templanza mezcla con calma lo que parece opuesto. Te invita a buscar el punto medio y a darles tiempo a los procesos.",q:["¿Qué extremos puedes equilibrar?","¿Dónde necesitas más paciencia?","¿Qué partes de ti buscan integrarse?"]},
  en:{n:"Temperance",kw:["Balance","Moderation","Patience","Integration"],t:"Temperance calmly blends what seems opposite. It invites you to seek the middle ground and give processes time.",q:["Which extremes can you balance?","Where do you need more patience?","Which parts of you are seeking to come together?"]},
  pt:{n:"A Temperança",kw:["Equilíbrio","Moderação","Paciência","Integração"],t:"A Temperança mistura com calma o que parece oposto. Convida-te a procurar o meio-termo e a dar tempo aos processos.",q:["Que extremos podes equilibrar?","Onde precisas de mais paciência?","Que partes de ti procuram integrar-se?"]}},
 {r:"XV",
  es:{n:"El Diablo",kw:["Apego","Deseo","Sombra","Ataduras"],t:"El Diablo muestra las cadenas que nos atan, muchas veces elegidas por nosotros. Habla de reconocer los apegos y la propia sombra para recuperar la libertad.",q:["¿Qué hábito o vínculo te quita libertad?","¿Qué deseo escondes, y por qué?","¿Qué cadena podrías soltar hoy?"]},
  en:{n:"The Devil",kw:["Attachment","Desire","Shadow","Bonds"],t:"The Devil shows the chains that bind us, often chosen by ourselves. It speaks of recognising attachments and your own shadow to regain your freedom.",q:["Which habit or relationship takes away your freedom?","What desire are you hiding, and why?","Which chain could you let go of today?"]},
  pt:{n:"O Diabo",kw:["Apego","Desejo","Sombra","Amarras"],t:"O Diabo mostra as correntes que nos prendem, muitas vezes escolhidas por nós. Fala de reconhecer os apegos e a própria sombra para recuperar a liberdade.",q:["Que hábito ou vínculo te tira liberdade?","Que desejo escondes, e porquê?","Que corrente poderias largar hoje?"]}},
 {r:"XVI",
  es:{n:"La Torre",kw:["Ruptura","Revelación","Liberación","Cambio súbito"],t:"La Torre derrumba lo que estaba construido sobre bases falsas. Aunque sacuda, despeja el terreno para construir algo más auténtico.",q:["¿Qué estructura de tu vida ya no se sostiene?","¿Qué verdad se está revelando?","¿Qué construirías si empezaras de nuevo?"]},
  en:{n:"The Tower",kw:["Upheaval","Revelation","Liberation","Sudden change"],t:"The Tower brings down what was built on false foundations. Although it shakes things up, it clears the ground to build something more authentic.",q:["Which structure in your life no longer holds?","What truth is being revealed?","What would you build if you started again?"]},
  pt:{n:"A Torre",kw:["Rutura","Revelação","Libertação","Mudança súbita"],t:"A Torre derruba o que foi construído sobre bases falsas. Embora abale, limpa o terreno para construir algo mais autêntico.",q:["Que estrutura da tua vida já não se sustenta?","Que verdade está a ser revelada?","O que construirias se começasses de novo?"]}},
 {r:"XVII",
  es:{n:"La Estrella",kw:["Esperanza","Inspiración","Sanación","Fe"],t:"La Estrella aparece después de la tormenta. Trae calma, esperanza y la confianza de que el camino tiene sentido.",q:["¿Qué te devuelve la esperanza?","¿Qué sueño merece tu confianza?","¿Cómo puedes compartir tu luz con otros?"]},
  en:{n:"The Star",kw:["Hope","Inspiration","Healing","Faith"],t:"The Star appears after the storm. It brings calm, hope and the trust that the path has meaning.",q:["What gives you hope again?","Which dream deserves your trust?","How can you share your light with others?"]},
  pt:{n:"A Estrela",kw:["Esperança","Inspiração","Cura","Fé"],t:"A Estrela aparece depois da tempestade. Traz calma, esperança e a confiança de que o caminho faz sentido.",q:["O que te devolve a esperança?","Que sonho merece a tua confiança?","Como podes partilhar a tua luz com os outros?"]}},
 {r:"XVIII",
  es:{n:"La Luna",kw:["Intuición","Sueños","Incertidumbre","Emociones profundas"],t:"La Luna ilumina a medias: muestra el mundo de los sueños, los miedos y la imaginación. Te invita a atravesar la incertidumbre guiándote por tu intuición.",q:["¿Qué miedo está distorsionando lo que ves?","¿Qué te dicen tus sueños últimamente?","¿Qué puedes aceptar aunque no lo entiendas del todo?"]},
  en:{n:"The Moon",kw:["Intuition","Dreams","Uncertainty","Deep emotions"],t:"The Moon only half lights the way: it shows the world of dreams, fears and imagination. It invites you to cross uncertainty guided by your intuition.",q:["Which fear is distorting what you see?","What have your dreams been telling you lately?","What can you accept even if you don’t fully understand it?"]},
  pt:{n:"A Lua",kw:["Intuição","Sonhos","Incerteza","Emoções profundas"],t:"A Lua ilumina pela metade: mostra o mundo dos sonhos, dos medos e da imaginação. Convida-te a atravessar a incerteza guiando-te pela tua intuição.",q:["Que medo está a distorcer o que vês?","O que te dizem os teus sonhos ultimamente?","O que podes aceitar mesmo sem o compreender totalmente?"]}},
 {r:"XIX",
  es:{n:"El Sol",kw:["Alegría","Claridad","Vitalidad","Éxito"],t:"El Sol ilumina todo con claridad y calidez. Habla de alegría simple, de confianza y de mostrarte tal como eres.",q:["¿Qué te llena de vida?","¿Dónde puedes mostrarte con más autenticidad?","¿Qué logro merece ser celebrado?"]},
  en:{n:"The Sun",kw:["Joy","Clarity","Vitality","Success"],t:"The Sun lights everything with clarity and warmth. It speaks of simple joy, confidence and showing yourself as you are.",q:["What makes you feel alive?","Where can you show yourself more authentically?","Which achievement deserves to be celebrated?"]},
  pt:{n:"O Sol",kw:["Alegria","Clareza","Vitalidade","Sucesso"],t:"O Sol ilumina tudo com clareza e calor. Fala de alegria simples, de confiança e de te mostrares tal como és.",q:["O que te enche de vida?","Onde podes mostrar-te com mais autenticidade?","Que conquista merece ser celebrada?"]}},
 {r:"XX",
  es:{n:"El Juicio",kw:["Despertar","Llamado","Renacer","Balance"],t:"El Juicio es un llamado a despertar. Te invita a revisar el camino recorrido, a perdonar y a responder a tu verdadera vocación.",q:["¿Qué llamado interior estás escuchando?","¿Qué necesitas perdonar, a otros o a ti?","¿Qué parte de ti está lista para renacer?"]},
  en:{n:"Judgement",kw:["Awakening","Calling","Rebirth","Reflection"],t:"Judgement is a call to awaken. It invites you to review the road travelled, forgive and answer your true calling.",q:["What inner calling are you hearing?","What do you need to forgive, in others or in yourself?","Which part of you is ready to be reborn?"]},
  pt:{n:"O Julgamento",kw:["Despertar","Chamamento","Renascimento","Balanço"],t:"O Julgamento é um chamamento para despertar. Convida-te a rever o caminho percorrido, a perdoar e a responder à tua verdadeira vocação.",q:["Que chamamento interior estás a ouvir?","O que precisas de perdoar, aos outros ou a ti?","Que parte de ti está pronta para renascer?"]}},
 {r:"XXI",
  es:{n:"El Mundo",kw:["Plenitud","Cierre","Logro","Integración"],t:"El Mundo celebra un ciclo completo. Habla de logro, de integración y de la satisfacción de haber llegado.",q:["¿Qué ciclo estás completando?","¿Qué aprendiste en este camino?","¿Qué nuevo viaje se abre ahora?"]},
  en:{n:"The World",kw:["Fulfilment","Completion","Achievement","Integration"],t:"The World celebrates a complete cycle. It speaks of achievement, integration and the satisfaction of having arrived.",q:["Which cycle are you completing?","What have you learned on this journey?","What new journey is opening now?"]},
  pt:{n:"O Mundo",kw:["Plenitude","Conclusão","Conquista","Integração"],t:"O Mundo celebra um ciclo completo. Fala de conquista, de integração e da satisfação de ter chegado.",q:["Que ciclo estás a completar?","O que aprendeste neste caminho?","Que nova viagem se abre agora?"]}}
];

/* ===== Utilidades ===== */
var LANGS = ["es","en","pt"];
function storeGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function storeSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function initialLang(){
  var m = /[?&]lang=(es|en|pt)/.exec(location.search); if(m) return m[1];
  var s = storeGet("ft-lang"); if(s && LANGS.indexOf(s) > -1) return s;
  var n = (navigator.language || "es").toLowerCase();
  if(n.indexOf("pt") === 0) return "pt";
  if(n.indexOf("es") === 0) return "es";
  return "en";
}
var lang = initialLang();
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k === "text") e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if(c == null) return; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function route(){
  var p = (location.hash || "#inicio").replace(/^#\/?/, "").split("/");
  return {page: p[0] || "inicio", id: p[1]};
}

/* ===== Vistas ===== */
function viewHome(t){
  var ev = h("div",{class:"card event"},[
    h("dl",null,[
      h("dt",{text:t.evWhat}),h("dd",{text:"Enchanted Craft Market"}),
      h("dt",{text:t.evWhen}),h("dd",{text:t.evDate}),
      h("dt",{text:t.evWhere}),h("dd",{text:t.evPlace}),
      h("dt",{text:t.evRead}),h("dd",{text:t.evReading}),
      h("dt",{text:t.evLang}),h("dd",{text:t.evLangs}),
      h("dt",{text:t.evProd}),h("dd",{text:t.evProducts})
    ])
  ]);
  return [h("h1",{text:t.homeTitle}), h("p",{class:"lead",text:t.homeLead}), ev,
    h("div",{class:"cta"},[h("a",{class:"btn",href:"#arcanos",text:t.ctaArc}), h("a",{class:"btn alt",href:"#juego",text:t.ctaGame})])];
}
function viewArcana(t){
  var grid = h("div",{class:"grid"}, ARCANA.map(function(a,i){
    return h("a",{class:"tile",href:"#arcanos/"+i},[h("span",{class:"num",text:a.r}),h("span",{class:"name",text:a[lang].n})]);
  }));
  return [h("h1",{text:t.arcTitle}), h("p",{class:"lead",text:t.arcLead}), grid, more(t,"arcanos")];
}
function viewArcanum(t,i){
  var a = ARCANA[i], d = a[lang];
  var prev = (i+21)%22, next = (i+1)%22;
  return [h("a",{class:"back",href:"#arcanos",text:t.backArc}),
    h("div",{class:"card"},[
      h("span",{class:"badge",text:a.r}), h("h1",{text:d.n}),
      h("h3",{text:t.kw}), h("div",{class:"chips"}, d.kw.map(function(k){return h("span",{class:"chip",text:k})})),
      h("h3",{text:t.meaning}), h("p",{text:d.t}),
      h("h3",{text:t.questions}), h("ol",{class:"q"}, d.q.map(function(q){return h("li",{text:q})}))
    ]),
    h("p",{class:"note",text:t.readingCta}),
    h("div",{class:"pager"},[h("a",{href:"#arcanos/"+prev,text:"← "+t.prev}), h("a",{href:"#arcanos/"+next,text:t.next+" →"})]),
    more(t,"arcanos")];
}
function viewGame(t){
  var list = h("div",{class:"elements"}, ELEMENTS.map(function(e){
    return h("a",{class:"el",href:"#juego/"+e.id},[h("span",{html:ICONS[e.icon]}), h("span",{class:"t",text:e[lang].name})]);
  }));
  list.querySelectorAll("span:first-child").forEach(function(s){ var svg = s.firstChild; s.parentNode.replaceChild(svg, s); });
  return [h("h1",{text:t.gameTitle}), h("p",{class:"lead",text:t.gameLead}), list, more(t,"juego")];
}
function viewElement(t,e){
  var d = e[lang];
  var icon = h("div",{html:ICONS[e.icon]}); var svg = icon.firstChild; svg.setAttribute("class","big-icon");
  return [h("a",{class:"back",href:"#juego",text:t.backGame}),
    h("div",{class:"card"},[svg, h("h1",{text:d.name}),
      h("div",{class:"chips"}, d.kw.map(function(k){return h("span",{class:"chip",text:k})})),
      h("p",{class:"msg",text:d.msg}),
      h("h3",{text:t.yourQ}), h("p",{text:d.q})]),
    h("p",{class:"note",text:t.readingCta}),
    more(t,"juego")];
}
function viewFeedback(t){
  var body = FORM_URL ? h("a",{class:"btn",href:FORM_URL,target:"_blank",rel:"noopener",text:t.fbBtn}) : h("p",{class:"note",text:t.fbSoon});
  return [h("h1",{text:t.fbTitle}), h("p",{class:"lead",text:t.fbLead}), h("div",{class:"cta"},[body]), more(t,"opiniones")];
}
function viewAbout(t){
  var a = ABOUT[lang];
  return [h("h1",{text:t.aboutTitle}),
    h("div",{class:"card"},[h("h2",{text:"Formando Tarot"})].concat(a.p.map(function(p){return h("p",{text:p})}))
      .concat([h("h3",{text:a.contact}), h("ul",null,a.items.map(function(x){return h("li",{text:x})}))])),
    more(t,"nosotros")];
}
function more(t,current){
  var all = [["arcanos",t.goArc],["juego",t.goGame],["opiniones",t.goFb],["nosotros",t.goAbout]];
  return h("section",{class:"more"},[h("h3",{text:t.moreTitle}),
    h("div",{class:"links"}, all.filter(function(x){return x[0] !== current}).map(function(x){return h("a",{href:"#"+x[0],text:x[1]})})
      .concat([h("a",{href:"#inicio",text:t.tabs[0]})]))]);
}

/* ===== Render ===== */
function render(){
  var t = UI[lang], r = route(), app = document.getElementById("app"), nodes, title = "Formando Tarot";
  document.documentElement.lang = lang === "pt" ? "pt-PT" : lang;
  var pages = ["inicio","arcanos","juego","opiniones","nosotros"];
  var tabs = document.getElementById("tabs"); tabs.innerHTML = "";
  pages.forEach(function(p,i){ var a = h("a",{href:"#"+p,text:t.tabs[i]}); if(p === r.page) a.setAttribute("aria-current","page"); tabs.appendChild(a); });
  document.querySelectorAll(".langs button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
  if(r.page === "arcanos" && r.id !== undefined && /^\d+$/.test(r.id) && +r.id < 22){ nodes = viewArcanum(t,+r.id); title = ARCANA[+r.id][lang].n + " · Formando Tarot"; }
  else if(r.page === "arcanos"){ nodes = viewArcana(t); title = t.arcTitle + " · Formando Tarot"; }
  else if(r.page === "juego" && r.id){ var e = ELEMENTS.filter(function(x){return x.id === r.id})[0]; if(e){ nodes = viewElement(t,e); title = e[lang].name + " · Formando Tarot"; } else { nodes = viewGame(t); } }
  else if(r.page === "juego"){ nodes = viewGame(t); title = t.gameTitle + " · Formando Tarot"; }
  else if(r.page === "opiniones"){ nodes = viewFeedback(t); title = t.fbTitle + " · Formando Tarot"; }
  else if(r.page === "nosotros"){ nodes = viewAbout(t); title = t.aboutTitle + " · Formando Tarot"; }
  else { nodes = viewHome(t); }
  app.innerHTML = ""; nodes.forEach(function(n){ app.appendChild(n); });
  document.title = title;
  document.getElementById("foot").textContent = t.foot;
}
document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click", function(){ lang = b.getAttribute("data-lang"); storeSet("ft-lang", lang); render(); });
});
window.addEventListener("hashchange", function(){ render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
